name: Calos
options:
  bundleIdPrefix: com.bddap
  deploymentTarget:
    watchOS: "10.0"
targets:
  Calos:
    type: application
    platform: watchOS
    sources:
      - Sources
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bddap.calos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        # Use the committed Info.plist (don't auto-generate) so a fresh clone builds.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Calos-Info.plist
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"  # Apple Watch
        CODE_SIGNING_ALLOWED: NO     # CI compile-check only; no signing
schemes:
  Calos:
    build:
      targets:
        Calos: all
    run:
      config: Debug
