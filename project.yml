name: Calos
options:
  bundleIdPrefix: com.bddap
  deploymentTarget:
    watchOS: "10.0"
targets:
  Calos:
    type: application
    platform: watchOS
    sources:
      - Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Calos
        WKApplication: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bddap.calos
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"  # Apple Watch
        CODE_SIGNING_ALLOWED: NO     # CI compile-check only; no signing
schemes:
  Calos:
    build:
      targets:
        Calos: all
    run:
      config: Debug
