name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # Whatever image a contributor drops as the app icon, make it valid:
      # exactly 1024x1024 and with NO alpha channel (Apple rejects alpha on
      # app icons). sips ships with macOS; bmp round-trip flattens alpha.
      - name: Normalize app icon
        run: |
          ICON="Assets.xcassets/AppIcon.appiconset/icon.png"
          if [ -f "$ICON" ]; then
            sips -s format png -z 1024 1024 "$ICON" --out "$ICON"
            sips -s format bmp "$ICON" --out /tmp/icon.bmp
            sips -s format png /tmp/icon.bmp --out "$ICON"
            echo "normalized $ICON:"; sips -g pixelWidth -g pixelHeight -g hasAlpha "$ICON"
          else
            echo "no icon.png present, skipping"
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (watchOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Calos.xcodeproj \
            -scheme Calos \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Keep the committed .xcodeproj in sync so the repo is clone-open-run
      # (no local xcodegen step needed). Only on master; [skip ci] avoids a loop.
      - name: Commit generated project
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Calos.xcodeproj
          if git diff --cached --quiet; then
            echo "no project changes"
          else
            git commit -m "CI: regenerate Calos.xcodeproj [skip ci]"
            git push
          fi
