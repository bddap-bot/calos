name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (watchOS Simulator, no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project Calos.xcodeproj \
            -scheme Calos \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      # Keep the committed .xcodeproj in sync so the repo is clone-open-run
      # (no local xcodegen step needed). Only on master; [skip ci] avoids a loop.
      - name: Commit generated project
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f Calos.xcodeproj
          if git diff --cached --quiet; then
            echo "no project changes"
          else
            git commit -m "CI: regenerate Calos.xcodeproj [skip ci]"
            git push
          fi
